services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: assistente
      POSTGRES_PASSWORD: assistente
      POSTGRES_DB: assistente_virtual
    ports:
      # 5433 no host: a 5432 já está ocupada por um Postgres nativo desta máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - assistente_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assistente -d assistente_virtual"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  assistente_pg_data:
